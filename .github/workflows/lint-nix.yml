name: Lint / Nix

on:
  workflow_call:

  push:
    branches: [main]
    paths:
      - .github/workflows/lint-nix.yml
      - flake.lock
      - flake.nix
      - justfile
      - '**/*.nix'

  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lint-nix.yml
      - flake.lock
      - flake.nix
      - justfile
      - '**/*.nix'

permissions:
  contents: read

concurrency:
  group: check-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-nix:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check Nix
        run: nix develop --command just lint-nix
