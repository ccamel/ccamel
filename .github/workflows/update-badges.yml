name: Update Badges

"on":
  workflow_run:
    workflows: ["Update Activity"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  update-badges:
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          token: ${{ secrets.BADGES_TOKEN }}

      - name: Generate badge files
        env:
          GITHUB_TOKEN: ${{ secrets.BADGES_TOKEN }}
        run: |
          set -euo pipefail

          workdir="$RUNNER_TEMP/my-badges"
          mkdir --parents "$workdir"
          (
            cd "$workdir"
            npx update-my-badges@1.0.247 \
              "${{ github.repository_owner }}" \
              --dryrun
          )

          rsync --archive --delete "$workdir/repo/my-badges/" my-badges/
          cp "$workdir/repo/README.md" README.md

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Prettify README.md
        run: npx prettier@3.0.3 README.md --write

      - name: Commit signed badge changes
        run: |
          set -euo pipefail

          git add README.md my-badges/
          if git diff --cached --quiet; then
            echo "No badge changes to commit"
            exit 0
          fi

          git commit --gpg-sign --message="docs(README): update my badges"
          git push
