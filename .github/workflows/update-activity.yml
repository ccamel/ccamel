name: Update Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  update-activity:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.21"

      - name: Install markscribe
        run: |
          go install github.com/muesli/markscribe@v0.6.0

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BADGES_TOKEN }}

      - name: Update README
        run: |
          echo "generate readme from template"
          markscribe -write README.md README.md.gtpl
        env:
          GITHUB_TOKEN: ${{ secrets.BADGES_TOKEN }}

      - name: Fix comments syntax
        run: |
          echo "Fixing comments syntax"
          sed -i 's/\[!--/<!--/g' README.md
          sed -i 's/--\]/-->/g' README.md

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Prettify README.md
        run: nix develop --command just format-readme

      - name: Add and commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: "docs(README): update my activity sections"
          author_name: ${{ vars.GIT_AUTHOR_NAME }}
          author_email: ${{ vars.GIT_AUTHOR_EMAIL }}
          committer_name: ${{ vars.GIT_AUTHOR_NAME }}
          committer_email: ${{ vars.GIT_AUTHOR_EMAIL }}
        env:
          GITHUB_TOKEN: ${{ secrets.BADGES_TOKEN }}
